<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Portal | Acceso</title>
<meta name="description" content="Entra a tu cuenta de Meridian.">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/meridian-icon.svg">
<link rel="preload" as="image" type="image/webp" href="/assets/portal-visual-meridian.64bc17e0.webp" media="(min-width:992px)" fetchpriority="high">

<style>
:root{
  --canvas:#0d0f0f;--panel:#111414;--input:#0d0f0f;--card:#161a19;
  --bd:#242a29;--bd-strong:#323a38;
  --sage:#7a9d96;--sage-hi:#8fb3ab;--sage-lo:#62847d;
  --txt:#ffffff;--muted:#9ea1a3;--subtle:#6b7176;--req:#ef4533;
  --pane:477px;
}
*,*::before,*::after{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;min-height:100%}
body{background:var(--canvas);color:var(--txt);
  font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:13px;line-height:18px;
  min-height:100svh;display:grid;grid-template-columns:var(--pane) minmax(0,1fr)}
img{display:block;max-width:100%}

/* ---------- panel del formulario ---------- */
.pane{background:var(--panel);padding:48px;display:flex;flex-direction:column;min-height:100svh}
.mark{margin-bottom:48px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}
h1{margin:0;font-size:24px;line-height:29px;font-weight:600;letter-spacing:-.02em}
.alt{text-align:right;font-size:12px;line-height:17px;color:var(--muted);flex-shrink:0}
.alt a{display:block;color:var(--sage-hi);font-weight:600;text-decoration:none}
.alt a:hover{text-decoration:underline}

.field{margin-bottom:26px}
.field label{display:block;font-size:13px;line-height:18px;font-weight:600;margin-bottom:8px}
.field label i{color:var(--req);font-style:normal}
.ctrl{position:relative}
.ctrl input,.ctrl select{width:100%;height:46px;background:var(--input);color:#fff;
  border:1px solid var(--bd);border-radius:10px;padding:12px 16px;
  font-family:inherit;font-size:13px;font-weight:500;line-height:22px;
  transition:border-color .18s,box-shadow .18s}
.ctrl input::placeholder{color:var(--subtle);font-weight:400}
.ctrl input:hover,.ctrl select:hover{border-color:var(--bd-strong)}
.ctrl input:focus,.ctrl select:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(122,157,150,.14)}
.ctrl input.bad{border-color:var(--req)}
.ctrl.has-eye input{padding-right:48px}
.eye{position:absolute;top:0;right:0;width:46px;height:46px;display:grid;place-items:center;
  background:none;border:0;cursor:pointer;color:var(--sage);padding:0}
.eye:hover{color:var(--sage-hi)}
.eye svg{width:18px;height:18px}
.err{display:none;margin-top:8px;font-size:12px;line-height:16px;color:#f0a79c}
.err.on{display:block}

.forgot{display:block;margin:-14px 0 26px;text-align:right;font-size:12px;line-height:17px;
  font-weight:600;color:var(--sage-hi);text-decoration:none}
.forgot:hover{text-decoration:underline}

.submit{width:100%;height:50px;border:1px solid var(--sage);border-radius:10px;cursor:pointer;
  background:var(--sage);color:#0d0f0f;font-family:inherit;font-size:20px;font-weight:600;line-height:30px;
  transition:background .18s,transform .1s,box-shadow .22s}
.submit:hover{background:var(--sage-hi);border-color:var(--sage-hi);box-shadow:0 6px 24px rgba(122,157,150,.24)}
.submit:active{transform:translateY(1px);background:var(--sage-lo)}
.submit[disabled]{opacity:.55;cursor:not-allowed}

.legal{margin:auto 0 0;padding-top:36px;font-size:11px;line-height:16px;color:var(--subtle)}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;border-radius:4px}

/* ---------- panel visual ---------- */
.visual{position:relative;overflow:hidden;background:#0b0d0d;border-radius:40px 0 0 40px}
.visual::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 62% 45%,rgba(122,157,150,.10) 0%,transparent 70%)}
.visual img{position:absolute;top:50%;left:50%;width:118%;max-width:none;
  transform:translate(-18%,-50%) rotate(-29deg);
  border-radius:30px;box-shadow:0 50px 110px -24px rgba(0,0,0,.95),0 0 0 1px rgba(122,157,150,.08)}

@media(max-width:991px){
  body{grid-template-columns:1fr}
  .visual{display:none}
  .pane{padding:40px 22px 32px;max-width:460px;margin:0 auto;width:100%;background:var(--canvas)}
  .mark{margin-bottom:36px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="pane">
  <!-- lockup vertical de Meridian -->
  <svg class="mark" width="196" height="252" viewBox="0 0 196 252" fill="none" role="img" aria-label="Meridian">
    <svg x="18" y="0" width="160" height="160" viewBox="0 0 432 432" overflow="visible">
      <path fill="#FEFEFF" d="M236.4,66c-3.4-19-19-16.8-19-16.8c-18.6,0-18.6,20.5-18.6,20.5c-0.3,2.5-0.7,4.9-1.2,7.4
        c-12.8,66-61.9,117.8-127.6,137.4c-23.3,7-40.4,6.9-40.4,6.9c115.5,6,156.1,119.2,156.1,119.2c-20.7-61.9-4.4-108.3,6.5-129.5
        c3.3-6.1,8.4-13.5,12.8-19.4c2.9-3.7,5.6-7.4,8.1-10.7l0,0l0,0c4.5-5.9,7.7-10.3,7.7-10.3C255.7,124.2,236.4,66,236.4,66z"/>
      <path fill="#7a9d96" d="M193.3,373.5c3.4,19,19,16.8,19,16.8c18.6,0,18.6-20.5,18.6-20.5c0.3-2.5,0.7-4.9,1.2-7.4
        c12.8-66,61.9-117.8,127.6-137.4c23.3-7,40.4-6.9,40.4-6.9c-115.5-6-156.1-119.2-156.1-119.2c20.7,61.9,4.4,108.3-6.5,129.5
        c-3.3,6.1-8.4,13.5-12.8,19.4c-2.9,3.7-5.6,7.4-8.1,10.7l0,0l0,0c-4.5,5.9-7.7,10.3-7.7,10.3C174,315.2,193.3,373.5,193.3,373.5z"/>
    </svg>
    <text x="0" y="212" fill="#FEFEFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
      font-size="26" font-weight="600" letter-spacing="6.2">MERIDIAN</text>
    <text x="2" y="238" fill="#7a9d96" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
      font-size="9" font-weight="600" letter-spacing="3.4">PORTAL DE CLIENTES</text>
  </svg>

  <div class="head">
    <h1>Iniciar sesión</h1>
    <p class="alt">¿No tienes cuenta?<a href="/register">Regístrate</a></p>
  </div>

  <form id="f" novalidate>
    <div class="field">
      <label for="email">Tu correo electrónico <i>*</i></label>
      <div class="ctrl"><input id="email" name="email" type="email" placeholder="Correo" autocomplete="email" inputmode="email"></div>
      <p class="err" id="email-err">Escribe un correo válido.</p>
    </div>

    <div class="field">
      <label for="pass">Tu contraseña <i>*</i></label>
      <div class="ctrl has-eye">
        <input id="pass" name="password" type="password" placeholder="Contraseña" autocomplete="current-password">
        <button class="eye" type="button" id="eye" aria-label="Mostrar contraseña">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>
      <p class="err" id="pass-err">Escribe tu contraseña.</p>
    </div>

    <a class="forgot" href="https://app.trademeridian.co/">¿Olvidaste tu contraseña?</a>

    <button class="submit" type="submit">Iniciar sesión</button>
  </form>

  <p class="legal">Meridian LLC · registrada en San Vicente y las Granadinas (4403 LLC 2026).
    Operar conlleva riesgo de pérdida de capital.</p>
</section>

<aside class="visual" aria-hidden="true">
  <picture>
    <source media="(max-width:1280px)" srcset="/assets/portal-visual-meridian-m.fcb968b7.webp" type="image/webp">
    <img src="/assets/portal-visual-meridian.64bc17e0.webp" alt="" width="1600" height="893">
  </picture>
</aside>

<script>
(function(){
  'use strict';
  var APP='https://app.trademeridian.co/?utm_source=Direto&utm_medium=Organico&utm_campaign=Direto&utm_content=Home&utm_term=';
  var qs=new URLSearchParams(location.search);
  var KEYS=['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid','ttclid'];
  function appUrl(email){
    var u=new URL(APP);
    KEYS.forEach(function(k){var v=qs.get(k); if(v) u.searchParams.set(k,v);});
    if(email) u.searchParams.set('email',email);
    return u.toString();
  }
  /* conserva los UTM al pasar a registro */
  var reg=document.querySelector('a[href="/register"]');
  if(reg && location.search) reg.href='/register'+location.search;

  var EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  var email=document.getElementById('email'), pass=document.getElementById('pass');
  var eErr=document.getElementById('email-err'), pErr=document.getElementById('pass-err');

  document.getElementById('eye').addEventListener('click',function(){
    var showing=pass.type==='text';
    pass.type=showing?'password':'text';
    this.setAttribute('aria-label',showing?'Mostrar contraseña':'Ocultar contraseña');
  });
  function mark(i,e,bad){i.classList.toggle('bad',bad);e.classList.toggle('on',bad);}
  email.addEventListener('input',function(){mark(email,eErr,false);});
  pass.addEventListener('input',function(){mark(pass,pErr,false);});

  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    var em=email.value.trim(), okE=EMAIL.test(em), okP=pass.value.length>0;
    mark(email,eErr,!okE); mark(pass,pErr,!okP);
    if(!okE){email.focus();return;}
    if(!okP){pass.focus();return;}
    location.href=appUrl(em);
  });
})();
</script>
</body>
</html>
